name: AI Service CI

on:
  push:
    branches: [main, refactor/python-microservice]
    paths:
      - "ai-service/**"
  pull_request:
    branches: [main]
    paths:
      - "ai-service/**"

permissions:
  contents: read

concurrency:
  group: ai-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install app dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev tools
        run: pip install ruff mypy pytest pytest-cov

      - name: Lint (ruff)
        # 100 errors in backlog — non-blocking until cleared.
        # Ruff still runs and its output is visible in the logs.
        # Remove continue-on-error once the codebase is clean.
        continue-on-error: true
        working-directory: ai-service
        run: ruff check . --output-format=github

      - name: Format check (ruff)
        continue-on-error: true
        working-directory: ai-service
        run: ruff format --check .

      - name: Type check (mypy)
        working-directory: ai-service
        run: mypy . --ignore-missing-imports --exclude tests/

      - name: Security audit (pip-audit)
        working-directory: ai-service
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc

      - name: Run tests with coverage
        id: tests
        working-directory: ai-service
        run: |
          pytest tests \
            --cov=. \
            --cov-fail-under=70 \
            --cov-report=term-missing \
            --cov-report=xml \
            -v 2>&1 | tee /tmp/pytest-output.txt

          grep -E "^TOTAL" /tmp/pytest-output.txt | tail -1 > /tmp/coverage-total.txt || true
          grep -E "passed|failed|error" /tmp/pytest-output.txt | tail -1 > /tmp/test-result-line.txt || true

      - name: Write CI summary
        if: always()
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"

          echo "## AI service CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${SHORT_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Event | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | 3.11 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Gates" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Mode |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint (ruff) | non-blocking (backlog mode) |" >> $GITHUB_STEP_SUMMARY
          echo "| Format (ruff) | non-blocking (backlog mode) |" >> $GITHUB_STEP_SUMMARY
          echo "| Type check (mypy) | blocking |" >> $GITHUB_STEP_SUMMARY
          echo "| Security audit (pip-audit) | blocking |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | blocking |" >> $GITHUB_STEP_SUMMARY

          if [ -f /tmp/test-result-line.txt ] && [ -s /tmp/test-result-line.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Test results" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat /tmp/test-result-line.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f /tmp/coverage-total.txt ] && [ -s /tmp/coverage-total.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Coverage" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat /tmp/coverage-total.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.run_id }}
          path: |
            ai-service/tests/
            ai-service/coverage.xml
          retention-days: 7