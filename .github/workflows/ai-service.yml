name: AI Service CI

on:
  push:
    branches: [main, refactor/python-microservice]
    paths:
      - "ai-service/**"
  pull_request:
    branches: [main]
    paths:
      - "ai-service/**"

permissions:
  contents: read

concurrency:
  group: ai-service-ci-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────
# Job graph:
#
#   lint ──┐
#           ├──▶ test (needs: lint, typecheck)
#   typecheck ──┘
#
# security runs independently — never blocks tests
# ──────────────────────────────────────────────

jobs:
  # ────────────────────────────────────────────
  # JOB 1: Lint + format (ruff)
  # ────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      - name: Install dev tools
        working-directory: ai-service
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: ai-service
        run: ruff check . --output-format=github

      - name: Format check (ruff)
        working-directory: ai-service
        run: ruff format --check .

  # ────────────────────────────────────────────
  # JOB 2: Type check (mypy)
  # V1 files excluded — they are dead code from the subprocess
  # architecture and are not part of the active v2 FastAPI service.
  # ────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install app dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev tools
        working-directory: ai-service
        run: pip install -r requirements-dev.txt

      - name: Type check (mypy)
        working-directory: ai-service
        run: |
          mypy . --ignore-missing-imports \
            --exclude tests/ \
            --exclude main\.py \
            --exclude resume_embeddings\.py \
            --exclude resume_scorer\.py \
            --exclude salary_predictor\.py \
            --exclude connection_recommender\.py \
            --exclude company_recommender\.py \
            --exclude skills_recommender\.py \
            --exclude utils\.py \
            --exclude clustering/job_clustering\.py \
            --exclude services/market_services/location_services\.py \
            --exclude services/market_services/job_title_services\.py \
            --exclude services/market_services/industry_services\.py

  # ────────────────────────────────────────────
  # JOB 3: Security audit (pip-audit)
  # Independent — runs in parallel, never blocks test job.
  # CVE-2025-3000: torch.jit.script memory corruption — local execution
  # only, not exploitable in our inference pipeline. Ignored.
  # ────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install app dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit production dependencies
        working-directory: ai-service
        run: |
          pip-audit -r requirements.txt --desc \
            --ignore-vuln CVE-2025-3000

  # ────────────────────────────────────────────
  # JOB 4: Tests + coverage
  # Waits for lint + typecheck before running.
  # ────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install app dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev tools
        working-directory: ai-service
        run: pip install -r requirements-dev.txt

      # Cache the sentence-transformers model between runs.
      # all-mpnet-base-v2 is ~420MB — without this it re-downloads
      # on every push, adding ~2-3 minutes to every CI run.
      # No restore-keys fallback: a partial model cache causes
      # sentence-transformers to fail on load.
      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-mpnet-base-v2-v1

      - name: Run tests with coverage
        id: tests
        working-directory: ai-service
        run: |
          pytest tests \
            --cov=. \
            --cov-fail-under=70 \
            --cov-report=term-missing \
            --cov-report=xml \
            -v 2>&1 | tee /tmp/pytest-output.txt

          grep -E "^TOTAL" /tmp/pytest-output.txt | tail -1 \
            > /tmp/coverage-total.txt || true
          grep -E "passed|failed|error" /tmp/pytest-output.txt | tail -1 \
            > /tmp/test-result-line.txt || true

      - name: Write CI summary
        if: always()
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"

          echo "## AI Service CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${SHORT_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Event | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | 3.11 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Gates" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Mode |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint (ruff) | blocking |" >> $GITHUB_STEP_SUMMARY
          echo "| Format (ruff) | blocking |" >> $GITHUB_STEP_SUMMARY
          echo "| Type check (mypy) | blocking |" >> $GITHUB_STEP_SUMMARY
          echo "| Security audit (pip-audit) | blocking |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (≥70% coverage) | blocking |" >> $GITHUB_STEP_SUMMARY

          if [ -f /tmp/test-result-line.txt ] && [ -s /tmp/test-result-line.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Test Results" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat /tmp/test-result-line.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f /tmp/coverage-total.txt ] && [ -s /tmp/coverage-total.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Coverage" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat /tmp/coverage-total.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.run_id }}
          path: |
            ai-service/coverage.xml
          retention-days: 7