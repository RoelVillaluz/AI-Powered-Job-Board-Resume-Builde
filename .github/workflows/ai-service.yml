name: AI Service CI

on:
  push:
    branches: [main, refactor/python-microservice]
    paths:
      - "ai-service/**"
  pull_request:
    branches: [main]
    paths:
      - "ai-service/**"

permissions:
  contents: read

concurrency:
  group: ai-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies & dev tools
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff mypy pytest pytest-cov

      - name: Run linter & formatter (Ruff)
        working-directory: ai-service
        run: |
          ruff check .
          ruff format --check .

      - name: Static type checking (Mypy)
        working-directory: ai-service
        run: mypy . --ignore-missing-imports

      - name: Run test suite with strict coverage
        working-directory: ai-service
        run: |
          pytest tests \
            --cov=. \
            --cov-fail-under=70