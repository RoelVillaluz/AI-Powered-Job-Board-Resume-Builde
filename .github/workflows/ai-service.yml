name: AI Service CI

on:
  push:
    branches: [main, refactor/python-microservice]
    paths:
      - "ai-service/**"
  pull_request:
    branches: [main, refactor/python-microservice]
    paths:
      - "ai-service/**"

jobs:
  # ── Job 1: Compile ────────────────────────────────────────────────────────────
  compile:
    name: Compile Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Compile All Modules
        working-directory: ai-service
        run: python -m compileall . -q

  # ── Job 2: Import & Startup ───────────────────────────────────────────────────
  startup:
    name: Import & Startup Check
    runs-on: ubuntu-latest

    env:
      MONGO_URI: mongodb://localhost:27017/testdb
    
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Check Router Imports
        working-directory: ai-service
        run: |
          python -c "from routers.embeddings import router" && echo "✅ embeddings router OK"
          python -c "from routers.scoring import router"    && echo "✅ scoring router OK"
          python -c "from routers.health import router"     && echo "✅ health router OK"
          python -c "from models.embeddings import EmbeddingModel" && echo "✅ model OK"

      - name: FastAPI Health Check
        working-directory: ai-service
        env:
          TRANSFORMERS_OFFLINE: "0"
        run: |
          python -c "
          from app import app
          from fastapi.testclient import TestClient
          client = TestClient(app)
          r = client.get('/health')
          assert r.status_code == 200, f'Health check failed: {r.status_code}'
          print('✅ FastAPI health check passed')
          "
  
  # ── Job 3: Tests ──────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: startup
 
    env:
      MONGO_URI: mongodb://localhost:27017/testdb
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
 
      - name: Install Dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt
 
      - name: Run Scoring Tests
        working-directory: ai-service
        run: python -m pytest tests/test_scoring_service.py -v -s --log-cli-level=INFO --tb=short

 
      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: ai-service/tests/
          retention-days: 7