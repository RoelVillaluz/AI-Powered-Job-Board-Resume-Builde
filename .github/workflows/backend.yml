name: Backend CI

on:
  push:
    branches: [main, refactor/python-microservice]
    paths:
      - "backend/**"
      - "shared/**"
  pull_request:
    branches: [main, refactor/python-microservice]
    paths:
      - "backend/**"
      - "shared/**"

jobs:
  build:
    # ─── Job 1: Build & Validate ─────────────────────────────────────────────────
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci --include=dev

      - name: Type Check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Check circular dependencies (TypeScript)
        working-directory: backend
        run: |
          npx madge \
            --circular \
            --extensions ts \
            --ts-config tsconfig.json \
            src/

      - name: Check circular dependencies (JavaScript)
        working-directory: backend
        run: |
          npx madge \
            --circular \
            --extensions js \
            src/

  test:
    # ─── Job 2: Run Tests ────────────────────────────────────────────────────────
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci --include=dev

      - name: Start MongoDB Replica Set
        run: |
          docker run -d --name mongodb -p 27017:27017 \
            mongo:6.0 mongod --replSet rs0 --bind_ip_all
          sleep 3
          docker exec mongodb mongosh --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          sleep 2

      - name: Create Test Env
        working-directory: backend
        run: |
          cat > .env.test << EOF
          NODE_ENV=test
          PORT=5001
          MONGO_URI=mongodb://localhost:27017/jobboard_test
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          REDIS_HOST=localhost
          REDIS_PORT=6379
          AI_SERVICE_URL=http://localhost:8000
          EOF

      - name: Run Tests
        working-directory: backend
        run: npm test -- --detectOpenHandles --forceExit