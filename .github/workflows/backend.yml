name: Backend CI

on:
  push:
    branches: [main, refactor/python-microservice]
    paths:
      - "backend/**"
      - "shared/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_node-ci.yml
    with:
      working-directory: backend
      run-tests: true
      lint-blocking: true   # backend is clean — keep lint as a hard gate