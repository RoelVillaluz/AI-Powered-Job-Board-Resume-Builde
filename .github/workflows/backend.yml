name: Backend CI

on:
  push:
    branches: [main, refactor/python-microservice]
    paths:
      - "backend/**"
      - "shared/**"
  pull_request:
    branches: [main, refactor/python-microservice]
    paths:
      - "backend/**"
      - "shared/**"

jobs:
  # ── Job 1: Install ────────────────────────────────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci --include=dev

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-node-modules-${{ hashFiles('backend/package-lock.json') }}

  # ── Job 2: Type Check ─────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-node-modules-${{ hashFiles('backend/package-lock.json') }}

      - name: Type Check
        working-directory: backend
        run: npx tsc --noEmit

  # ── Job 3: Circular Dependencies ──────────────────────────────────────────────
  circular-deps:
    name: Circular Dependency Check
    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-node-modules-${{ hashFiles('backend/package-lock.json') }}

      - name: Check TypeScript Circular Deps
        working-directory: backend
        run: |
          npx madge \
            --circular \
            --extensions ts \
            --ts-config tsconfig.json \
            src/

      - name: Check JavaScript Circular Deps
        working-directory: backend
        run: |
          npx madge \
            --circular \
            --extensions js \
            src/

  # ── Job 4: Test ───────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [typecheck, circular-deps]

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-node-modules-${{ hashFiles('backend/package-lock.json') }}

      - name: Start MongoDB Replica Set
        run: |
          docker run -d --name mongodb -p 27017:27017 \
            mongo:6.0 mongod --replSet rs0 --bind_ip_all
          sleep 3
          docker exec mongodb mongosh --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          sleep 2

      - name: Create Test Env
        working-directory: backend
        run: |
          echo "NODE_ENV=test" >> .env.test
          echo "PORT=5001" >> .env.test
          echo "MONGO_URI=mongodb://localhost:27017/jobboard_test" >> .env.test
          echo "REDIS_HOST=localhost" >> .env.test
          echo "REDIS_PORT=6379" >> .env.test
          echo "AI_SERVICE_URL=http://localhost:8000" >> .env.test
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.test

      - name: Run Tests
        working-directory: backend
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/jobboard_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          AI_SERVICE_URL: http://localhost:8000
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm test -- --detectOpenHandles --forceExit

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/
          retention-days: 7