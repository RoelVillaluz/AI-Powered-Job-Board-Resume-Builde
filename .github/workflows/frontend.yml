name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "shared/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "shared/**"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_node-ci.yml
    with:
      working-directory: frontend
      run-tests: false
      run-build: true