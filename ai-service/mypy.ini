[mypy]
ignore_missing_imports = True
exclude = (
    tests/|
    main\.py|
    resume_embeddings\.py|
    resume_scorer\.py|
    salary_predictor\.py|
    connection_recommender\.py|
    company_recommender\.py|
    skills_recommender\.py|
    utils\.py
)

# ── V1 dead code ──────────────────────────────────────────────────────────────
# These modules are from the subprocess-based v1 architecture and are no
# longer part of the active v2 FastAPI service. Errors are suppressed rather
# than fixed to avoid spending time on dead code.

[mypy-clustering.*]
ignore_errors = True

[mypy-services.market_services.*]
ignore_errors = True