# ai-service/pytest.ini
[pytest]
testpaths = tests
pythonpath = .
# importlib mode: each conftest.py gets a unique module name, so running
# multiple test directories together (e.g. tests/gemini/ tests/scoring/) no
# longer collides on the bare `conftest` module name.
importmode = importlib
log_cli = true
log_cli_level = INFO